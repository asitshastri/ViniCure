# Dependency updates (P0-10): weekly version updates, and security updates as soon as they exist.
# Updates arrive as pull requests that run the whole CI before anyone merges them.
# The "terraform" entry is added with the infrastructure code (P3-02), when its folder exists.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    # Patch and minor updates of development tools come as one pull request; everything that
    # ships to patients (runtime dependencies) stays one by one so each can be read.
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels: [dependencies]
