# Continuous integration (P0-09). Every push to main and every pull request runs:
#   checks   install from the lockfile, dependency audit, format, lint, types, all tests on real
#            Postgres 17 and Valkey 8, production builds, the browser tests
#   secrets  gitleaks over the whole history
#   images   build the web and worker images and scan them with Trivy
# Actions are pinned to full commit SHAs (the comment names the release). Dependabot keeps them
# current (.github/dependabot.yml). The workflow can read the repository and nothing else.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vinicure
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vinicure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vinicure -d vinicure"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-only-password
      DATABASE_MIGRATION_URL: postgres://migrator:dev-only-change-me@localhost:5432/vinicure
      DATABASE_TEST_URL: postgres://app:dev-only-change-me@localhost:5432/vinicure
      DATABASE_URL: postgres://app:dev-only-change-me@localhost:5432/vinicure
      VALKEY_TEST_URL: redis://localhost:6379
      VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm (the version in package.json)
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node -v && pnpm -v
      - run: pnpm install --frozen-lockfile
      # Known vulnerable runtime dependencies stop the build (high and above).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Create the database roles and apply every migration
        run: |
          psql -h localhost -U vinicure -d postgres -v ON_ERROR_STOP=1 -f docker/postgres-init/01-roles.sql
          pnpm db:migrate
      - name: Unit, integration, access-control and security tests
        run: pnpm test
      - run: pnpm build
      - run: pnpm build:worker
      - name: Install the browser for the end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Keep the browser traces when a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ${{ matrix.target }} image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: vinicure-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Check the image runs as a non-root user
        run: |
          user=$(docker image inspect vinicure-${{ matrix.target }}:ci --format '{{.Config.User}}')
          echo "user=$user"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
      - name: Scan the image for known vulnerabilities (high and critical fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinicure-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
